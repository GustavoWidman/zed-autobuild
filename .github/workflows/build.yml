name: Build and Cache Zed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild the current pinned release without checking for updates
        required: false
        default: false
        type: boolean

concurrency:
  group: build-zed
  cancel-in-progress: false

jobs:
  check-new-release:
    name: Check for new Zed release
    runs-on: ubuntu-24.04
    outputs:
      has_new_release: ${{ steps.check.outputs.has_new_release }}
      new_tag: ${{ steps.check.outputs.new_tag }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      should_update: ${{ steps.check.outputs.should_update }}
      should_build: ${{ steps.check.outputs.should_build }}
      build_tag: ${{ steps.check.outputs.build_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Check if builds are disabled
        id: disabled
        run: |
          if [ -f .disable-builds ]; then
            echo "Builds disabled: $(cat .disable-builds)"
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "disabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for new release
        if: steps.disabled.outputs.disabled != 'true'
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          TAG_FORMAT='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          CURRENT_TAG=$(cat .current 2>/dev/null || printf 'v0.0.0')
          if ! [[ "$CURRENT_TAG" =~ $TAG_FORMAT ]]; then
            printf 'Pinned Zed tag does not match the accepted Zed tag format: %s\n' "$CURRENT_TAG" >&2
            exit 1
          fi

          echo "Current tag: $CURRENT_TAG"
          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$FORCE_REBUILD" == "true" ]]; then
            echo "Rebuilding pinned release: $CURRENT_TAG"
            echo "new_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "build_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "has_new_release=false" >> "$GITHUB_OUTPUT"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE=$(
            curl --fail --silent --show-error --retry 3 https://api.github.com/repos/zed-industries/zed/releases | jq -er --arg current "$CURRENT_TAG" '
              def parse_tag:
                capture("^v(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)(?:-(?<pre>((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$")
                | .major |= tonumber
                | .minor |= tonumber
                | .patch |= tonumber
                | .pre = (if .pre == null then null else (.pre | split(".")) end);
              def cmp_scalar($left; $right):
                if $left < $right then -1
                elif $left > $right then 1
                else 0
                end;
              def numeric_identifier:
                test("^(0|[1-9][0-9]*)$");
              def cmp_identifier($left; $right):
                ($left | numeric_identifier) as $left_numeric
                | ($right | numeric_identifier) as $right_numeric
                | if $left_numeric and $right_numeric then
                    cmp_scalar(($left | tonumber); ($right | tonumber))
                  elif $left_numeric then -1
                  elif $right_numeric then 1
                  else cmp_scalar($left; $right)
                  end;
              def cmp_pre($left; $right):
                if ($left | length) == 0 and ($right | length) == 0 then 0
                elif ($left | length) == 0 then -1
                elif ($right | length) == 0 then 1
                else
                  cmp_identifier($left[0]; $right[0]) as $comparison
                  | if $comparison == 0 then
                      cmp_pre($left[1:]; $right[1:])
                    else $comparison
                    end
                end;
              def cmp_version($left; $right):
                if $left.major != $right.major then
                  cmp_scalar($left.major; $right.major)
                elif $left.minor != $right.minor then
                  cmp_scalar($left.minor; $right.minor)
                elif $left.patch != $right.patch then
                  cmp_scalar($left.patch; $right.patch)
                elif $left.pre == null and $right.pre == null then 0
                elif $left.pre == null then 1
                elif $right.pre == null then -1
                else cmp_pre($left.pre; $right.pre)
                end;
              ($current | parse_tag) as $current_version
              | [
                  .[]
                  | .tag_name
                  | select(
                      type == "string"
                      and test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$")
                    )
                  | { tag: ., semver: parse_tag }
                ]
              | reduce .[] as $candidate (
                  null;
                  if . == null or cmp_version(.semver; $candidate.semver) < 0 then
                    $candidate
                  else .
                  end
                )
              | if . == null then
                  error("no valid Zed release tag found")
                else
                  "\(.tag)\t\(cmp_version($current_version; .semver))"
                end
            '
          )
          IFS=$'\t' read -r LATEST_TAG VERSION_COMPARISON <<< "$RELEASE"
          if [[ -z "$LATEST_TAG" || -z "$VERSION_COMPARISON" ]]; then
            printf 'Could not determine the latest Zed release\n' >&2
            exit 1
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "new_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION_COMPARISON" == "-1" ]]; then
            echo "New release found: $LATEST_TAG"
            echo "build_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "has_new_release=true" >> "$GITHUB_OUTPUT"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCKED_ZED_REV=$(jq -er '.nodes.zed.locked.rev' flake.lock)
          TAGGED_ZED_REV=$(curl --fail --silent --show-error --retry 3 "https://api.github.com/repos/zed-industries/zed/commits/$CURRENT_TAG" | jq -er '.sha')
          if [[ "$LOCKED_ZED_REV" != "$TAGGED_ZED_REV" ]]; then
            echo "Pinned Zed tag moved: $CURRENT_TAG now resolves to $TAGGED_ZED_REV"
            echo "build_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "has_new_release=false" >> "$GITHUB_OUTPUT"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_SUCCESSFUL_BUILD=$(cat .last-success 2>/dev/null || true)
          CURRENT_BUILD="$CURRENT_TAG"$'\t'"$LOCKED_ZED_REV"
          echo "build_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "has_new_release=false" >> "$GITHUB_OUTPUT"
          echo "should_update=false" >> "$GITHUB_OUTPUT"
          if [[ "$LAST_SUCCESSFUL_BUILD" != "$CURRENT_BUILD" ]]; then
            echo "No successful cache build recorded for $CURRENT_TAG at $LOCKED_ZED_REV"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new release"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  update-release:
    name: Update Zed release
    needs: [check-new-release]
    if: needs.check-new-release.outputs.should_update == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Update release files and Cargo Git output hashes
        env:
          ZED_TAG: ${{ needs.check-new-release.outputs.new_tag }}
        run: .github/scripts/update-zed "$ZED_TAG"

      - name: Commit release update
        id: commit
        env:
          ZED_TAG: ${{ needs.check-new-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .current flake.nix flake.lock
          if ! git diff --cached --quiet; then
            git commit --quiet -m "chore: update to $ZED_TAG"
            for attempt in 1 2 3; do
              if git push --quiet origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                printf 'Could not push release update after %s attempts\n' "$attempt" >&2
                exit 1
              fi
              git fetch --quiet origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.system }}
    needs: [check-new-release, update-release]
    if: >-
      always() &&
      needs.check-new-release.outputs.should_build == 'true' &&
      (needs.update-release.result == 'success' || needs.update-release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.update-release.outputs.commit_sha || github.sha }}

      - name: Free up disk space
        if: matrix.system == 'x86_64-linux'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org https://cache.garnix.io https://zed.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr9g= zed.cachix.org-1:/pHQ6dpMsAZk2DiP4WCL0p9YDNKWj2Q5FL20bNmw1cU=
            cores = ${{ matrix.system == 'aarch64-linux' && '2' || '0' }}
            max-jobs = ${{ matrix.system == 'aarch64-linux' && '2' || 'auto' }}
      - uses: cachix/cachix-action@v15
        with:
          name: r3dlust
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Zed for ${{ matrix.system }}
        run: |
          echo "BUILDING $(cat .current)"
          if [ "${{ matrix.system }}" = "aarch64-linux" ]; then
            nix build .#default -L --cores 2 --max-jobs 2
          else
            nix build .#default -L
          fi

      - name: Push to Cachix
        run: |
          STORE_PATH=$(nix eval --raw .#packages.${{ matrix.system }}.default.outPath 2>/dev/null || nix eval --raw .#default.outPath)
          PIN_NAME="zed-${{ matrix.system }}"
          echo "Pushing to Cachix: $STORE_PATH"

          nix path-info --recursive "$STORE_PATH" | cachix push r3dlust

          cachix pin r3dlust "$PIN_NAME" "$STORE_PATH" --keep-revisions 3

  mark-release-success:
    name: Record successful Zed cache build
    needs: [check-new-release, update-release, build-and-push]
    if: >-
      always() &&
      needs.check-new-release.outputs.should_build == 'true' &&
      (needs.update-release.result == 'success' || needs.update-release.result == 'skipped') &&
      needs.build-and-push.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout built release
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.update-release.outputs.commit_sha || github.sha }}

      - name: Commit successful cache build marker
        env:
          ZED_TAG: ${{ needs.check-new-release.outputs.build_tag }}
        run: |
          set -euo pipefail
          TAG_FORMAT='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ! [[ "$ZED_TAG" =~ $TAG_FORMAT ]]; then
            printf 'Zed tag does not match the accepted Zed tag format: %s\n' "$ZED_TAG" >&2
            exit 1
          fi

          LOCKED_ZED_REV=$(jq -er '.nodes.zed.locked.rev' flake.lock)
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          printf '%s\t%s\n' "$ZED_TAG" "$LOCKED_ZED_REV" > .last-success
          git add .last-success
          if ! git diff --cached --quiet; then
            git commit --quiet -m "chore: record successful build for $ZED_TAG"
            for attempt in 1 2 3; do
              if git push --quiet origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                printf 'Could not push build marker after %s attempts\n' "$attempt" >&2
                exit 1
              fi
              git fetch --quiet origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi
